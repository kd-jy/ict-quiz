<meta name="theme-color" content="#F2EDE1">

<script>
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem('ictquiz.v1') || 'null');
      if (saved && saved.settings) {
        if (saved.settings.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (saved.settings.fontScale) document.documentElement.style.setProperty('--font-scale', String(saved.settings.fontScale));
      }
    } catch (err) { /* 隐私模式下忽略 */ }
  })();
</script>

      <span class="brand-text">网络赛道<span class="brand-dot">·</span>刷题</span>
    </a>
    <div class="topbar-right">
      <span class="topbar-progress" id="top-progress">已做 0 / 0</span>
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色主题" title="切换主题">

          <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z"></path>

    </div>
